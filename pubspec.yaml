name: terminal_x
description: Offline Android market simulation and trading terminal.
publish_to: none
version: 0.3.1+31

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Retained for historical account/backup regression tests; tree-shaken from release.
  shared_preferences: ^2.5.3
  xml: ^6.5.0
  file_picker: 10.3.10
  drift: 2.32.1
  crypto: 3.0.6
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
