name: Terminal X - Import Stage A from ZIP

on:
  workflow_dispatch:

# Manually triggered only; used to commit code after tests pass.
permissions:
  contents: write

concurrency:
  group: terminal-x-import-stage-a
  cancel-in-progress: false

jobs:
  import-stage-a:
    if: github.repository == '54854434/terminal_x' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Validate archive and unpack only Stage A code
        shell: bash
        run: |
          set -euo pipefail
          archive='terminal_x_v01b_stage_A_engine_tests.zip'
          test -f "$archive" || { echo "Missing ZIP in repository root: $archive"; exit 1; }
          echo '122203f2af5dba3cc54cbc8c9b4caaa42ed7e9866885dda977574848202aa7cf  terminal_x_v01b_stage_A_engine_tests.zip' | sha256sum -c -

          # Reject unknown/extra paths and modified archives.
          printf '%s\n' \
            '.github/workflows/v01b-engine-validation.yml' \
            'docs/V01B_MOBILE_UPGRADE.md' \
            'lib/engine/tx_engine.dart' \
            'lib/engine/tx_session.dart' \
            'pubspec.yaml' \
            'test/tx_engine_test.dart' \
            'test/tx_session_test.dart' | LC_ALL=C sort > /tmp/expected-zip-paths
          unzip -Z1 "$archive" | LC_ALL=C sort > /tmp/actual-zip-paths
          diff -u /tmp/expected-zip-paths /tmp/actual-zip-paths

          # Prevent an unexpected later edit of pubspec from being overwritten.
          old_sha='3588913c0fee69849390884f39e6578aeac87478'
          stage_a_sha='a7a2bd3e04b6c31e3be942a1537396bceb100516'
          current_sha="$(git hash-object pubspec.yaml)"
          if [[ "$current_sha" != "$old_sha" && "$current_sha" != "$stage_a_sha" ]]; then
            echo 'pubspec.yaml has changed; aborting rather than overwriting it.'
            exit 1
          fi

          # Do not replace existing, different engine/test/docs files.
          for path in \
            lib/engine/tx_engine.dart lib/engine/tx_session.dart \
            test/tx_engine_test.dart test/tx_session_test.dart \
            docs/V01B_MOBILE_UPGRADE.md; do
            if [[ -f "$path" ]] && ! cmp -s "$path" <(unzip -p "$archive" "$path"); then
              echo "File already exists with different content: $path"
              exit 1
            fi
          done

          # Deliberately do not extract .github/workflows/*.yml. The built-in
          # GITHUB_TOKEN normally cannot create/update workflow files via push.
          unzip -o -q "$archive" \
            pubspec.yaml \
            lib/engine/tx_engine.dart lib/engine/tx_session.dart \
            test/tx_engine_test.dart test/tx_session_test.dart \
            docs/V01B_MOBILE_UPGRADE.md

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve Flutter dependencies
        run: flutter pub get

      - name: Run all 17 proposed tests (must pass before commit)
        run: flutter test test/tx_engine_test.dart test/tx_session_test.dart

      - name: Commit Stage A code only after green tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            pubspec.yaml \
            lib/engine/tx_engine.dart lib/engine/tx_session.dart \
            test/tx_engine_test.dart test/tx_session_test.dart \
            docs/V01B_MOBILE_UPGRADE.md
          if git diff --cached --quiet; then
            echo 'Stage A files are already up to date.'
            exit 0
          fi
          git commit -m 'Add V0.1b Stage A trading engine and tested scenarios'
          git push origin HEAD:main
