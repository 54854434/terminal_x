name: Terminal X - Flutter Regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/tx-flutter-regression.yml'

permissions:
  contents: read

concurrency:
  group: terminal-x-flutter-regression
  cancel-in-progress: false

jobs:
  test:
    name: Flutter unit and widget tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Dart/Flutter dependencies
        run: flutter pub get

      - name: Run the complete real regression suite
        run: flutter test --no-pub
