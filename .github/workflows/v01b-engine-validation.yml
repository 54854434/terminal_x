name: V0.1b Engine Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'lib/engine/**'
      - 'test/tx_engine_test.dart'
      - 'test/tx_session_test.dart'
      - 'pubspec.yaml'
      - '.github/workflows/v01b-engine-validation.yml'

permissions:
  contents: read

jobs:
  test-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install dependencies
        run: flutter pub get
      - name: Test matching engine and session recovery
        run: flutter test test/tx_engine_test.dart test/tx_session_test.dart
