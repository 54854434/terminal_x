name: Terminal X V0.1c - APK signature compatibility audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terminal-x-v01c-signature-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == '54854434/terminal_x' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create isolated Android project
        run: flutter create --org com.terminalx.preview --project-name terminal_x --platforms=android .
      - name: Install dependencies
        run: flutter pub get
      - name: Validate existing V0.1b engine and recovery tests
        run: flutter test test/tx_engine_test.dart test/tx_session_test.dart
      - name: Build disposable diagnostic APK (never publish APK)
        run: flutter build apk --debug
      - name: Compare package and certificate against accepted V0.1b APK
        shell: bash
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-debug.apk
          EXPECTED_PACKAGE='com.terminalx.preview.terminal_x'
          # Signer certificate SHA-256 from the ORIGINAL accepted V0.1b
          # artifact 11702639474 (ZIP hash verified independently).
          EXPECTED_CERT='3DE881F8022CF6E13594F0687661E1697241272B585EC5396CAE965ABC2A9D64'
          EXPECTED_VERSION_CODE='1'
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT" && test -d "$SDK_ROOT/build-tools"
          SIGNER="$(find "$SDK_ROOT/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$SIGNER" && test -x "$SIGNER"
          AAPT="$(dirname "$SIGNER")/aapt"
          test -x "$AAPT"
          "$SIGNER" verify --verbose --print-certs "$APK" > /tmp/tx-apk-certs.txt
          "$AAPT" dump badging "$APK" > /tmp/tx-apk-manifest.txt
          PACKAGE="$(sed -n "s/^package: name='\([^']*\)'.*/\1/p" /tmp/tx-apk-manifest.txt | head -n 1)"
          VERSION_CODE="$(sed -n "s/^package: .*versionCode='\([^']*\)'.*/\1/p" /tmp/tx-apk-manifest.txt | head -n 1)"
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/tx-apk-certs.txt | tr -d ':' | tr '[:lower:]' '[:upper:]' | head -n 1)"
          test -n "$PACKAGE" && test -n "$VERSION_CODE"
          test "${#CERT}" -eq 64
          PACKAGE_RESULT=mismatch
          CERT_RESULT=mismatch
          if [[ "$PACKAGE" == "$EXPECTED_PACKAGE" ]]; then PACKAGE_RESULT=match; fi
          if [[ "$CERT" == "$EXPECTED_CERT" ]]; then CERT_RESULT=match; fi
          {
            echo '# Terminal X V0.1c - signing compatibility report'
            echo
            echo '- Baseline: V0.1b phone-tested APK; original run 38141798593; artifact 11702639474'
            echo '- Baseline APK SHA-256: d41b241a4cd7d6ae48e95d66dce967e2a97abd6209973382f67fd43cdb1ae01d'
            echo "- Expected package: $EXPECTED_PACKAGE"
            echo "- Built package: $PACKAGE"
            echo "- Package match: $PACKAGE_RESULT"
            echo "- Expected certificate SHA-256: $EXPECTED_CERT"
            echo "- Built certificate SHA-256: $CERT"
            echo "- Certificate match: $CERT_RESULT"
            echo "- Baseline versionCode: $EXPECTED_VERSION_CODE"
            echo "- Built versionCode: $VERSION_CODE"
            echo "- Built APK SHA-256: $(sha256sum "$APK" | cut -d ' ' -f 1)"
            echo
            echo 'This is a CI-only diagnostic. DO NOT install, uninstall, or overwrite V0.1b.'
            echo 'A different package or signer means Android cannot update the existing app in place.'
            echo 'A match does not by itself guarantee a successful upgrade or safe data migration.'
          } | tee signature-audit.txt >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PACKAGE_RESULT" != match || "$CERT_RESULT" != match ]]; then
            echo '::warning::This APK cannot safely replace V0.1b as an in-place update. Preserve installed data.'
          fi
      - name: Upload text report only (no APK or signing material)
        uses: actions/upload-artifact@v4
        with:
          name: terminal-x-v01c-signature-report
          path: signature-audit.txt
          if-no-files-found: error
          retention-days: 30
