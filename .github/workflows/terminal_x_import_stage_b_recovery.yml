      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create isolated Android preview project
        run: flutter create --org com.terminalx.preview --project-name terminal_x --platforms=android .
      - name: Resolve dependencies
        run: flutter pub get
      - name: Run 17 trading engine and recovery tests
        run: flutter test test/tx_engine_test.dart test/tx_session_test.dart
      - name: Build preview APK
        run: flutter build apk --debug
      - name: Push only App and handoff files (workflow already uploaded by owner)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- lib/main.dart docs/TERMINAL_X_HANDOFF.md
          git diff --cached --quiet && { echo 'No staged changes; abort'; exit 1; }
          git commit -m 'Integrate V0.1b UI and verified handoff v1.9'
          git push origin HEAD:main
          echo 'Stage B app and handoff pushed to main.'
      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: terminal-x-v01b-stage-b-preview-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
