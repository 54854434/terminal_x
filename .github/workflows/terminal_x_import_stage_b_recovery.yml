name: Terminal X - Recover Stage B and Publish APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terminal-x-recover-stage-b
  cancel-in-progress: false

jobs:
  recover-stage-b:
    if: github.repository == '54854434/terminal_x' && github.ref == 'refs/heads/main' && github.actor == '54854434'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate inputs and stage App and v1.9 handoff only
        shell: bash
        run: |
          set -euo pipefail
          archive='terminal_x_v01b_stage_B_bulk_v18.zip'
          test -f "$archive" || { echo "Missing original Stage B ZIP"; exit 1; }
          echo '15cc8963fc97f0f559d5bafcf7e1ff97c1493a716b49b6a22eaaa859135b5de5  terminal_x_v01b_stage_B_bulk_v18.zip' | sha256sum -c -
          printf '%s\n' '.github/workflows/build-apk.yml' 'docs/TERMINAL_X_HANDOFF.md' 'lib/main.dart' | LC_ALL=C sort >/tmp/expected-paths
          unzip -Z1 "$archive" | LC_ALL=C sort >/tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          # Require the manually uploaded tested build workflow and the Stage A baseline.
          test "$(git hash-object .github/workflows/build-apk.yml)" = '28c5be6c60663b742531bcfbde026d8682cf5c79' || { echo 'Please manually upload the new build-apk.yml first'; exit 1; }
          test "$(git hash-object pubspec.yaml)" = 'a7a2bd3e04b6c31e3be942a1537396bceb100516' || { echo 'pubspec unexpectedly changed'; exit 1; }
          test "$(git hash-object lib/main.dart)" = '5170999c27c1c28098935525ee9e408dc9a8c62e' || { echo 'lib/main.dart already changed; inspect main before retrying'; exit 1; }
          for path in lib/engine/tx_engine.dart lib/engine/tx_session.dart test/tx_engine_test.dart test/tx_session_test.dart; do test -f "$path" || { echo "Missing Stage A source: $path"; exit 1; }; done
          test ! -e docs/TERMINAL_X_HANDOFF.md || { echo 'New handoff file already exists; inspect before overwriting'; exit 1; }
          unzip -o -q "$archive" lib/main.dart
          mkdir -p docs
          cat > /tmp/terminal-x-handoff.b64 <<'TX_HANDOFF_PAYLOAD'
