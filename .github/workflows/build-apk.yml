name: Build Terminal X V0.1c (isolated APK)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create ISOLATED Android V0.1c application
        run: |
          flutter create --org com.terminalx.v01c --project-name terminal_x --platforms=android .
          grep -Rq 'applicationId = "com.terminalx.v01c.terminal_x"' android/app/build.gradle.kts
          grep -Rq 'namespace = "com.terminalx.v01c.terminal_x"' android/app/build.gradle.kts
          ! grep -Rq 'com.terminalx.preview.terminal_x' android/app/build.gradle.kts
          sed -i 's/android:label="terminal_x"/android:label="Terminal X V0.1c"/' android/app/src/main/AndroidManifest.xml
          grep -q 'android:label="Terminal X V0.1c"' android/app/src/main/AndroidManifest.xml
      - name: Install dependencies
        run: flutter pub get
      - name: Test engine, import, backup safety and SQLite isolation
        run: flutter test test/tx_engine_test.dart test/tx_session_test.dart test/tx_backup_commit_test.dart test/tx_sqlite_store_test.dart
      - name: Build isolated V0.1c test APK
        run: flutter build apk --debug
      - name: Upload isolated test APK
        uses: actions/upload-artifact@v4
        with:
          name: terminal-x-v01c-isolated-test-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
