name: Terminal X - Import Stage B + APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: terminal-x-import-stage-b
  cancel-in-progress: false

jobs:
  stage-b:
    if: github.repository == '54854434/terminal_x' && github.ref == 'refs/heads/main' && github.actor == '54854434'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify and unpack exact Stage B package
        shell: bash
        run: |
          set -euo pipefail
          archive='terminal_x_v01b_stage_B_bulk_v18.zip'
          test -f "$archive" || { echo "Missing: $archive in repository root"; exit 1; }
          echo '15cc8963fc97f0f559d5bafcf7e1ff97c1493a716b49b6a22eaaa859135b5de5  terminal_x_v01b_stage_B_bulk_v18.zip' | sha256sum -c -
          printf '%s\n' \
            '.github/workflows/build-apk.yml' \
            'docs/TERMINAL_X_HANDOFF.md' \
            'lib/main.dart' | LC_ALL=C sort > /tmp/stage-b-expected-paths
          unzip -Z1 "$archive" | LC_ALL=C sort > /tmp/stage-b-actual-paths
          diff -u /tmp/stage-b-expected-paths /tmp/stage-b-actual-paths

          # Refuse to overwrite unexpected edits or missing Stage A engine.
          test "$(git hash-object lib/main.dart)" = '5170999c27c1c28098935525ee9e408dc9a8c62e' || { echo 'lib/main.dart changed since Stage A; abort'; exit 1; }
          test "$(git hash-object .github/workflows/build-apk.yml)" = 'ef2ba7e10a0010649f15910abc35198af34447df' || { echo 'build-apk.yml changed; abort'; exit 1; }
          test "$(git hash-object pubspec.yaml)" = 'a7a2bd3e04b6c31e3be942a1537396bceb100516' || { echo 'pubspec.yaml differs from tested Stage A; abort'; exit 1; }
          test -f lib/engine/tx_engine.dart
          test -f lib/engine/tx_session.dart
          test -f test/tx_engine_test.dart
          test -f test/tx_session_test.dart
          if [[ -e docs/TERMINAL_X_HANDOFF.md ]]; then
            echo 'Canonical handoff file now exists; review version before overwriting.'
            exit 1
          fi
          unzip -o -q "$archive" \
            lib/main.dart \
            .github/workflows/build-apk.yml \
            docs/TERMINAL_X_HANDOFF.md

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android preview project
        run: flutter create --org com.terminalx.preview --project-name terminal_x --platforms=android .

      - name: Install dependencies
        run: flutter pub get

      - name: All 17 Stage A engine and recovery tests
        run: flutter test test/tx_engine_test.dart test/tx_session_test.dart

      - name: Build Android preview APK (must succeed before commit)
        run: flutter build apk --debug

      - name: Commit all Stage B project files together
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- lib/main.dart .github/workflows/build-apk.yml docs/TERMINAL_X_HANDOFF.md
          git commit -m 'Integrate V0.1b UI, guarded APK build and handoff v1.8'
          git push origin HEAD:main
          echo 'Stage B changes pushed; see git commit above for SHA.'

      - name: Upload APK only after successful push
        uses: actions/upload-artifact@v4
        with:
          name: terminal-x-v01b-stage-b-preview-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
