name: Terminal X - One ZIP Verified ARM64 Release

on:
  push:
    branches: [main]
    paths:
      - 'terminal_x_batch.zip'
  workflow_dispatch:

# This installer is only activated by a direct commit of a single ZIP to main.
# Never use pull_request_target and never run untrusted fork contents with write access.
permissions:
  contents: write

concurrency:
  group: terminal-x-import-main
  cancel-in-progress: false

jobs:
  verify-build-commit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout the ZIP commit
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify ZIP manifest and stage source changes
        id: batch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path, PurePosixPath
          import re
          import stat
          import zipfile

          archive = Path('terminal_x_batch.zip')
          if not archive.is_file():
              raise SystemExit('Upload terminal_x_batch.zip to repository root first.')
          if archive.stat().st_size > 20 * 1024 * 1024:
              raise SystemExit('Batch ZIP must be no more than 20 MiB.')

          def allowed(path):
              parts = PurePosixPath(path).parts
              return (bool(parts) and len(parts) >= 2 and
                      parts[0] in ('lib', 'test', 'assets', 'scripts') or
                      path in ('docs/TERMINAL_X_HANDOFF.md', 'pubspec.yaml',
                               'analysis_options.yaml'))

          def check_path(path):
              if (not isinstance(path, str) or len(path) > 220 or not path or
                  path.startswith('/') or '\\' in path or ':' in path or
                  any(x in ('', '.', '..') for x in path.split('/')) or
                  any(x.startswith('.') for x in path.split('/')) or
                  not allowed(path)):
                  raise ValueError('Disallowed batch file path: ' + repr(path))
              return path

          with zipfile.ZipFile(archive, 'r') as z:
              entries = z.infolist()
              if len(entries) < 2 or len(entries) > 101:
                  raise ValueError('Unexpected ZIP entry count.')
              names = [info.filename for info in entries]
              if len(set(names)) != len(names) or 'manifest.json' not in names:
                  raise ValueError('ZIP contains duplicate names or no manifest.')
              if any(i.is_dir() or stat.S_ISLNK(i.external_attr >> 16)
                     or i.flag_bits & 1 for i in entries):
                  raise ValueError('Directories, symlinks and encrypted ZIP entries are forbidden.')
              if sum(i.file_size for i in entries) > 30 * 1024 * 1024:
                  raise ValueError('Uncompressed ZIP contents exceed 30 MiB.')
              if z.getinfo('manifest.json').file_size > 64 * 1024:
                  raise ValueError('Manifest is too large.')
              plan = json.loads(z.read('manifest.json').decode('utf-8'))
              if plan.get('schema') != 1 or not isinstance(plan.get('files'), list):
                  raise ValueError('Unsupported manifest schema.')
              files = plan['files']
              if not files or len(files) > 100:
                  raise ValueError('Manifest must declare 1–100 files.')
              paths = [check_path(entry['path']) for entry in files]
              if len(set(paths)) != len(paths) or set(names) != set(paths) | {'manifest.json'}:
                  raise ValueError('ZIP entries differ from the manifest file list.')

              build = plan['build']
              org = build['org']
              target = check_path(build['target'])
              app_id = build['application_id']
              label = build['display_name']
              artifact = build['artifact']
              tests = build['tests']
              if (not re.fullmatch(r'[a-z][a-z0-9]*(?:\.[a-z][a-z0-9]*)+', org)
                  or app_id != org + '.terminal_x'
                  or not target.startswith('lib/') or not target.endswith('.dart')
                  or not re.fullmatch(r'[A-Za-z0-9 ._-]{1,32}', label)
                  or not re.fullmatch(r'[A-Za-z0-9_-]{1,70}', artifact)
                  or not isinstance(tests, list) or not 1 <= len(tests) <= 40
                  or len(set(tests)) != len(tests)
                  or any(not isinstance(t, str) or not t.startswith('test/') or
                         not t.endswith('_test.dart') or '\\' in t or '..' in t
                         for t in tests)):
                  raise ValueError('Invalid build configuration or test paths.')
              # The package ID, label and architecture are stable across releases.
              if (org != 'com.terminalx.game'
                  or app_id != 'com.terminalx.game.terminal_x'
                  or label != 'Terminal X'
                  or build.get('mode') != 'signed-release-arm64'
                  or not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', build.get('version_name', ''))
                  or not isinstance(build.get('version_code'), int)
                  or not 23 <= build['version_code'] < 2000000000):
                  raise ValueError('Unsigned, wrong-identity or unversioned app build refused.')
              # Refuse any downgrade or same-code rebuild of the stable app line.
              previous_pubspec = Path('pubspec.yaml')
              if previous_pubspec.is_file():
                  prev_match = re.search(r'^version:\s*\d+\.\d+\.\d+\+(\d+)\s*$',
                      previous_pubspec.read_text(encoding='utf-8'), re.M)
                  if prev_match is not None and int(prev_match.group(1)) >= 23:
                      if build['version_code'] <= int(prev_match.group(1)):
                          raise ValueError('versionCode must increase after each signed release.')

              # Verify every new file AND its expected old content before replacing anything.
              staged = {}
              for entry in files:
                  p = entry['path']
                  blob = z.read(p)
                  digest = hashlib.sha256(blob).hexdigest()
                  if digest != entry['sha256']:
                      raise ValueError('SHA-256 mismatch: ' + p)
                  dest = Path(p)
                  if dest.is_symlink():
                      raise ValueError('Refusing symlink destination: ' + p)
                  expected_old = entry.get('previous_sha256')
                  if dest.is_file():
                      actual_old = hashlib.sha256(dest.read_bytes()).hexdigest()
                      if expected_old != actual_old:
                          raise ValueError('Repository version conflict: ' + p)
                  elif expected_old is not None:
                      raise ValueError('Expected file missing in repository: ' + p)
                  staged[p] = blob

              # Optional repository cleanup. Protect active tests and storage.
              # Exact legacy entrypoints / placeholder paths require SHA-256,
              # AND only disappear after tests and the new APK build pass.
              removed = plan.get('remove', [])
              if not isinstance(removed, list) or len(removed) > 30:
                  raise ValueError('remove must be a list of at most 30 entries.')
              def removable(path):
                  if not isinstance(path, str) or '\\' in path or '..' in path:
                      return False
                  # Only previously committed, disposable archives / build drops.
                  safe_legacy = {
                      'lib/main_terminal_v02.dart',
                      'lib/main_terminal_v021.dart',
                      'lib/storage_probe_main.dart',
                      'lib/market/test',
                      'lib/widgets/test',
                      'docs/V01B_MOBILE_UPGRADE.md',
                  }
                  return (path in safe_legacy
                      or bool(re.fullmatch(
                          r'terminal_x_[a-zA-Z0-9_-]+\.(?:zip|apk)', path))
                      or bool(re.fullmatch(
                          r'(?:dist|artifacts|out)/(?:tmp|obsolete|preview)/'
                          r'[a-zA-Z0-9_./-]+\.(?:zip|apk)', path)))
              remove_paths = set()
              for entry in removed:
                  if not isinstance(entry, dict) or set(entry) != {'path', 'sha256'}:
                      raise ValueError('Each remove entry requires path and sha256.')
                  p = entry['path']
                  digest = entry['sha256']
                  if (not removable(p) or p == 'terminal_x_batch.zip'
                      or p in staged or p in remove_paths
                      or not isinstance(digest, str)
                      or not re.fullmatch(r'[a-f0-9]{64}', digest)):
                      raise ValueError('Unsafe cleanup entry: ' + repr(p))
                  dest = Path(p)
                  if not dest.is_file() or dest.is_symlink():
                      raise ValueError('Cleanup file missing or unsafe: ' + p)
                  if hashlib.sha256(dest.read_bytes()).hexdigest() != digest:
                      raise ValueError('Cleanup checksum conflict: ' + p)
                  remove_paths.add(p)

          for p, blob in staged.items():
              dest = Path(p)
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(blob)
          if not Path(target).is_file() or any(not Path(t).is_file() for t in tests):
              raise ValueError('Build target or one or more tests not present after import.')
          version_text = Path('pubspec.yaml').read_text(encoding='utf-8')
          expected_version = f"version: {build['version_name']}+{build['version_code']}"
          if expected_version not in version_text.splitlines():
              raise ValueError('pubspec version must match release manifest.')
          Path('.tx_batch_plan.json').write_text(json.dumps(plan), encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('artifact=' + artifact + '\n')
          print(f'Validated {len(staged)} files, batch={plan.get("batch")!r}.')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare isolated Android application
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          plan = json.loads(Path('.tx_batch_plan.json').read_text())['build']
          subprocess.run(['flutter', 'create', '--org', plan['org'],
                          '--project-name', 'terminal_x', '--platforms=android', '.'],
                         check=True)
          gradle_file = Path('android/app/build.gradle.kts')
          gradle = gradle_file.read_text()
          if ('applicationId = "' + plan['application_id'] + '"' not in gradle or
              'namespace = "' + plan['application_id'] + '"' not in gradle):
              raise SystemExit('The generated Android application ID does not match the manifest.')
          if ('    buildTypes {' not in gradle or
              'signingConfig = signingConfigs.getByName("debug")' not in gradle):
              raise SystemExit('Unexpected Flutter Android signing template; refusing unsafe fallback.')
          # Gradle reads the private key ONLY from ephemeral runner env/files.
          # No key material is ever committed to the public repository.
          key_config = '''    signingConfigs {
                  create("terminalRelease") {
                      storeFile = file(System.getenv("TX_KEYSTORE_FILE"))
                      storePassword = System.getenv("TX_STORE_PASSWORD")
                      keyAlias = System.getenv("TX_KEY_ALIAS")
                      keyPassword = System.getenv("TX_KEY_PASSWORD")
                  }
              }
          '''
          gradle = gradle.replace('    buildTypes {', key_config + '    buildTypes {', 1)
          gradle = gradle.replace('signingConfig = signingConfigs.getByName("debug")',
                                  'signingConfig = signingConfigs.getByName("terminalRelease")', 1)
          gradle_file.write_text(gradle)
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'android:label="terminal_x"' not in text:
              raise SystemExit('Unexpected Android label template; stop, do not overwrite.')
          manifest.write_text(text.replace('android:label="terminal_x"',
                                           'android:label="' + plan['display_name'] + '"'))
          PY

      - name: Prepare stable private release signing key
        shell: bash
        env:
          TX_RELEASE_KEYSTORE_B64: ${{ secrets.TX_RELEASE_KEYSTORE_B64 }}
          TX_STORE_PASSWORD: ${{ secrets.TX_STORE_PASSWORD }}
          TX_KEY_PASSWORD: ${{ secrets.TX_KEY_PASSWORD }}
          TX_KEY_ALIAS: ${{ secrets.TX_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ['TX_RELEASE_KEYSTORE_B64', 'TX_STORE_PASSWORD',
                   'TX_KEY_PASSWORD', 'TX_KEY_ALIAS']
          if any(not os.environ.get(n) for n in names):
              raise SystemExit('Stable signing secrets missing: configure 4 Actions secrets first.')
          data = base64.b64decode(os.environ['TX_RELEASE_KEYSTORE_B64'], validate=True)
          if not 100 <= len(data) < 48_000:
              raise SystemExit('Invalid release keystore size.')
          path = Path('/tmp/terminal_x_release.jks')
          path.write_bytes(data)
          path.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as out:
              out.write('TX_KEYSTORE_FILE=' + str(path) + '\n')
          print('Signing key loaded privately (no contents printed).')
          PY
          keytool -list -keystore /tmp/terminal_x_release.jks \
            -storepass "$TX_STORE_PASSWORD" -alias "$TX_KEY_ALIAS" >/dev/null

      - name: Install Flutter packages
        run: flutter pub get

      - name: Run batch regression suite once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          tests = json.loads(Path('.tx_batch_plan.json').read_text())['build']['tests']
          subprocess.run(['flutter', 'test', *tests], check=True)
          PY

      - name: Build signed, optimized ARM64 Release APK
        shell: bash
        env:
          TX_STORE_PASSWORD: ${{ secrets.TX_STORE_PASSWORD }}
          TX_KEY_PASSWORD: ${{ secrets.TX_KEY_PASSWORD }}
          TX_KEY_ALIAS: ${{ secrets.TX_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          config = json.loads(Path('.tx_batch_plan.json').read_text())['build']
          subprocess.run(['flutter', 'build', 'apk', '--release', '--split-per-abi',
              '--target-platform', 'android-arm64', '--target', config['target'],
              '--build-name', config['version_name'],
              '--build-number', str(config['version_code']),
              '--dart-define', 'TX_APP_VERSION=' + config['version_name']],
              check=True)
          apk = Path('build/app/outputs/flutter-apk/app-arm64-v8a-release.apk')
          if not apk.is_file():
              raise SystemExit('ARM64 release APK missing; do not commit source changes.')
          print('Verified output exists; ARM64 APK bytes:', apk.stat().st_size)
          PY
          # Verify the output's v2/v3 Android signature before publishing.
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SIGNER="$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$SIGNER"
          "$SIGNER" verify --verbose --print-certs \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload the signed ARM64 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.batch.outputs.artifact }}
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Commit all verified files as one change and remove uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          manifest = json.loads(Path('.tx_batch_plan.json').read_text())
          paths = [f['path'] for f in manifest['files']]
          # All removal entries were checked before tests/build. Verify again at
          # commit time to prevent accidentally removing modified files.
          for entry in manifest.get('remove', []):
              p = entry['path']
              file = Path(p)
              if (not file.is_file() or file.is_symlink()
                  or __import__('hashlib').sha256(file.read_bytes()).hexdigest()
                      != entry['sha256']):
                  raise SystemExit('Cleanup target changed; abort: ' + p)
              subprocess.run(['git', 'rm', '--', p], check=True)
          Path('terminal_x_batch.zip').unlink()
          subprocess.run(['git', 'add', '--', *paths], check=True)
          subprocess.run(['git', 'add', '-A', '--', 'terminal_x_batch.zip'], check=True)
          PY
          if git diff --cached --quiet; then
            echo 'No source changes staged; batch was already present.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Verified Terminal X signed release batch and safe cleanup'
            git push origin HEAD:main
          fi
          echo '### Terminal X batch import' >> "$GITHUB_STEP_SUMMARY"
          echo 'Regression and APK build passed; source files committed together.' >> "$GITHUB_STEP_SUMMARY"

  prune-obsolete-debug-artifacts:
    name: Prune old disposable debug APK artifacts
    needs: verify-build-commit
    if: needs.verify-build-commit.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Retain recent APKs, remove old disposable artifacts
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const {owner, repo} = context.repo;
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {owner, repo, per_page: 100}
            );
            const eligible = new Map();
            for (const a of artifacts) {
              // Only generated preview APK artifacts from V0.2 onwards.
              // Protect V0.1*, backups, signed builds and release artifacts.
              if (!/^terminal-x-v(?:0[2-9]|[1-9][0-9]+)[a-z0-9-]*-apk$/.test(a.name)) continue;
              if (/backup|signed|release|stable/i.test(a.name)) continue;
              if (!eligible.has(a.name)) eligible.set(a.name, []);
              eligible.get(a.name).push(a);
            }
            const cutoff = Date.now() - 14 * 86400000;
            let removed = 0;
            for (const [name, group] of eligible) {
              group.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
              for (const a of group.slice(3)) {  // Always retain the latest 3 per version.
                if (new Date(a.created_at).getTime() >= cutoff) continue;
                if (removed >= 10) break;         // Cap deletions per batch.
                await github.rest.actions.deleteArtifact({owner, repo, artifact_id: a.id});
                core.info(`Removed old debug artifact ${name}, id=${a.id}`);
                removed++;
              }
            }
            await core.summary.addHeading('Preview artifact retention')
              .addRaw(`Only debug APK artifacts: retained latest 3 per artifact name, removed ${removed} older than 14 days (max 10 per run).`)
              .write();

  retire-legacy-workflows:
    name: Disable obsolete automatic CI (retain source history)
    needs: verify-build-commit
    if: needs.verify-build-commit.result == 'success' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Disable only known old build workflows (reversible)
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const {owner, repo} = context.repo;
            const oldWorkflows = [
              'build-apk.yml', 'build-storage-probe.yml',
              'build-v02-terminal.yml', 'v01b-engine-validation.yml',
              'v01c-signature-audit.yml',
            ];
            for (const workflow_id of oldWorkflows) {
              try {
                await github.rest.actions.disableWorkflow({owner, repo, workflow_id});
                core.info(`Disabled obsolete ${workflow_id} (not deleted)`);
              } catch (e) {
                core.warning(`Could not disable ${workflow_id}: ${e.message}`);
              }
            }
            await core.summary.addRaw('Historical workflows disabled where permitted; their files and past runs remain in Git for audit.').write();
